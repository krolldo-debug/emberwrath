# iOS-App (app/): nur von Hand („Run workflow“), macOS-Läufe sind teuer. upload=false prüft nur den Build, upload=true lädt zu App Store Connect hoch.
# Für den Upload braucht das Repo diese Secrets (Anleitung: app/README.md):
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (Inhalt der .p8-Datei)
name: iOS-App

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Zu App Store Connect hochladen'
        type: boolean
        default: true

concurrency:
  group: app-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      - run: xcodebuild -version

      - name: Bauen (ohne Signatur, Prüfung)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.upload) }}
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -destination 'generic/platform=iOS' -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO build

      - name: Archivieren und hochladen
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID KEY_P8; do [ -n "${!v}" ] || { echo "::error::Secret fehlt: $v (siehe app/README.md)"; exit 1; }; done
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          # Fähigkeiten der App-ID („Mit Apple anmelden“, Mitteilungen) einschalten, sonst passt App.entitlements nicht zum Profil
          ASC_KEY_ID="$KEY_ID" ASC_ISSUER_ID="$ISSUER_ID" ASC_KEY_P8="$KEY_P8" node ../tools/appstore-faehigkeiten.mjs
          # Unsigniert archivieren: Signieren mit Entwicklerprofil bräuchte registrierte Geräte.
          # Der Export signiert danach für den App Store (Cloud-Signatur über den API-Schlüssel).
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
          # Unsigniert archiviert, also stecken die Berechtigungen (App.entitlements) noch nicht in der App. Per Ad-hoc-Signatur
          # einbetten; der Export übernimmt sie in die App-Store-Signatur. Ohne das fehlen „Mit Apple anmelden“ und Mitteilungen.
          APP=build/App.xcarchive/Products/Applications/App.app
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - --entitlements ios/App/App/App.entitlements "$APP"
          ENT="$(codesign -d --entitlements - "$APP" 2>&1)"
          case "$ENT" in *applesignin*aps-environment*|*aps-environment*applesignin*) ;; *) echo "::error::Berechtigungen fehlen in der App"; exit 1;; esac
          sed "s/TEAM_ID/$TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" "${AUTH[@]}"
          rm -f "$KEY"
          echo "Hochgeladen: Build ${{ github.run_number }}. Er erscheint nach der Verarbeitung in App Store Connect unter TestFlight." >> "$GITHUB_STEP_SUMMARY"
