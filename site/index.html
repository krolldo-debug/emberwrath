<!doctype html>
<html lang="de" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05020a">
  <title>Emberwrath</title>
  <meta name="description" content="Emberwrath ist ein düsteres Pixel-Action-RPG. Kostenlos im Browser, auf PC und Handy.">
  <meta property="og:title" content="Emberwrath">
  <meta property="og:description" content="Ein düsteres Pixel-Action-RPG. Kostenlos im Browser, auf PC und Handy.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://emberwrath.kroll-do.workers.dev/img/kampf-titel.webp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="img/kampf-titel.webp">
  <link rel="stylesheet" href="site.css">
</head>
<body>
<!--#include header-->

<main id="inhalt">
  <section class="hero" aria-labelledby="titel">
    <div class="hero-bg"><img class="px" src="img/kampf-titel.webp" alt="Ein Krieger in der Rüstung des Tyrannen schlägt mit glühender Klinge nach Varkhul, dem Knochenfürsten" width="1536" height="864"></div>
    <canvas class="embers" aria-hidden="true"></canvas>
    <div class="hero-content">
      <h1 id="titel">Emberwrath</h1>
      <img class="hero-logo px" src="img/logo.png" alt="Emberwrath" width="146" height="30">
      <p class="tagline">Der Berg ist erwacht. Trag die Glut in die Dunkelheit.</p>
      <div class="hero-cta">
        <a class="btn primary big" data-link="play" href="spielen/">Jetzt spielen</a>
        <a class="btn big ghost" data-link="register" href="spielen/">Konto erstellen</a>
      </div>
      <p class="hint">Kostenlos im Browser, auf PC und Handy.</p>
    </div>
  </section>

  <section class="fights" aria-label="Szenen aus dem Spiel">
    <div class="wrap shots">
      <figure class="shot wide reveal" data-zoom="Krieger mit „Emberwrath, Klinge der Könige“ gegen Ignaroth">
        <img class="px" src="img/kampf-krieger.webp" alt="Krieger mit flammender Klinge im Nahkampf gegen den Glut-Tyrannen Ignaroth" width="1056" height="594" loading="lazy">
        <figcaption>Krieger gegen Ignaroth</figcaption>
      </figure>
      <figure class="shot reveal" data-zoom="Magier mit dem Arkanen Weltenstab: Meteor">
        <img class="px" src="img/kampf-magier.webp" alt="Ein Meteor schlägt mitten in einer Gruppe Feuerteufel ein" width="1056" height="594" loading="lazy">
        <figcaption>Magier, Meteor</figcaption>
      </figure>
      <figure class="shot reveal" data-zoom="Schurke mit „Nachtflüstern“ gegen Nerith">
        <img class="px" src="img/kampf-schurke.webp" alt="Schurke springt per Schattenschritt auf Nerith, die Ertrunkene Priesterin" width="1056" height="594" loading="lazy">
        <figcaption>Schurke gegen Nerith</figcaption>
      </figure>
      <figure class="shot reveal" data-zoom="Waldläufer mit „Sternenfall“ gegen Nerith">
        <img class="px" src="img/kampf-waldlaeufer.webp" alt="Waldläuferin feuert einen Fächer aus Lichtpfeilen auf Nerith" width="1152" height="648" loading="lazy">
        <figcaption>Waldläufer gegen Nerith</figcaption>
      </figure>
    </div>
  </section>

  <section class="community" id="community" aria-label="Community">
    <div class="wrap socials" data-socials></div>
  </section>
</main>

<!--#include footer-->
</body>
</html>
